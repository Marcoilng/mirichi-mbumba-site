<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Événements Mirichi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Montserrat:wght@100..900&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #f5f0e8; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        .event-card { background: #161616; border: 1px solid #c4922a; border-radius: 12px; padding: 24px; margin-bottom: 20px; cursor: pointer; transition: all 0.3s; }
        .event-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(196,146,42,0.2); }
        .btn { background: linear-gradient(135deg, #c4922a 0%, #b8860b 100%); color: white; padding: 12px 24px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
        .btn:hover { opacity: 0.9; }
        input, textarea { width: 100%; padding: 12px; background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: white; margin-bottom: 16px; }
        input:focus, textarea:focus { outline: none; border-color: #c4922a; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="font-size: 48px; margin-bottom: 40px; text-align: center;">Événements Mirichi</h1>
        
        <div id="events-section">
            <div id="events-grid"></div>
        </div>

        <div id="reservation-form" class="hidden">
            <button onclick="showEvents()" class="btn" style="margin-bottom: 20px;">← Retour</button>
            <h2 style="margin-bottom: 20px;">Réserver votre place</h2>
            <div id="selected-event-info" style="padding: 16px; background: #1e1e1e; border-radius: 8px; margin-bottom: 20px;"></div>
            
            <form onsubmit="handleBooking(event)">
                <input type="text" id="fullName" placeholder="Nom complet *" required>
                <input type="email" id="email" placeholder="Email *" required>
                <input type="tel" id="phone" placeholder="Téléphone *" required>
                <textarea id="message" placeholder="Message (optionnel)" rows="3"></textarea>
                <button type="submit" class="btn">Réserver ma place</button>
            </form>
        </div>

        <div id="success-message" class="hidden">
            <h2 style="margin-bottom: 20px;">Réservation confirmée!</h2>
            <p style="margin-bottom: 20px;">Votre place a été réservée avec succès.</p>
            <button onclick="downloadTicket()" class="btn">Télécharger mon ticket</button>
            <button onclick="showEvents()" class="btn" style="margin-top: 20px;">Retour aux événements</button>
        </div>
    </div>

    <script>
        // Event Data
        const events = [
            {
                id: 1,
                title: 'TOUCH UP',
                theme: 'L\'identité avant la réussite',
                date: 'Samedi 29 août 2026',
                time: 'À partir de 13h00',
                location: 'Silikin Village, Kinshasa',
                description: 'Nous voulons contribuer à une génération de jeunes qui ne cherchent pas seulement à avoir, mais qui travaillent d\'abord à devenir.',
                category: 'Leadership'
            }
        ];

        const MAX_PARTICIPANTS = 100;
        let selectedEvent = null;
        let currentBooking = null;

        // Get current registrations from localStorage
        function getCurrentRegistrations() {
            const bookings = JSON.parse(localStorage.getItem('mirichi_bookings') || '[]');
            return bookings.length;
        }

        // Get available places
        function getAvailablePlaces() {
            return MAX_PARTICIPANTS - getCurrentRegistrations();
        }

        // Load events
        function loadEvents() {
            const eventsGrid = document.getElementById('events-grid');
            const availablePlaces = getAvailablePlaces();
            
            eventsGrid.innerHTML = events.map(event => `
                <div class="event-card" onclick="selectEvent(${event.id})">
                    <h2 style="font-size: 24px; margin-bottom: 12px;">${event.title}</h2>
                    <p style="color: #888; margin-bottom: 8px;">${event.date}</p>
                    <p style="color: #888; margin-bottom: 8px;">${event.location}</p>
                    <p style="margin-bottom: 16px;">${event.description}</p>
                    <p style="color: #c4922a; font-weight: 600;">Places disponibles: ${availablePlaces}</p>
                </div>
            `).join('');
        }

        // Select event
        function selectEvent(eventId) {
            selectedEvent = events.find(e => e.id === eventId);
            if (!selectedEvent) return;

            document.getElementById('events-section').classList.add('hidden');
            document.getElementById('reservation-form').classList.remove('hidden');
            document.getElementById('success-message').classList.add('hidden');

            document.getElementById('selected-event-info').innerHTML = `
                <strong>${selectedEvent.title}</strong><br>
                ${selectedEvent.date}<br>
                ${selectedEvent.location}
            `;
        }

        // Show events
        function showEvents() {
            document.getElementById('events-section').classList.remove('hidden');
            document.getElementById('reservation-form').classList.add('hidden');
            document.getElementById('success-message').classList.add('hidden');
            document.querySelector('form').reset();
            selectedEvent = null;
            currentBooking = null;
            loadEvents();
        }

        // Handle booking
        function handleBooking(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;

            // Check if event is full
            const availablePlaces = getAvailablePlaces();
            if (availablePlaces <= 0) {
                alert('Désolé, toutes les places sont réservées.');
                return;
            }

            // Generate ticket code
            const ticketCode = 'MIR-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();

            currentBooking = {
                event: selectedEvent,
                fullName,
                email,
                phone,
                message,
                ticketCode,
                bookingDate: new Date().toISOString()
            };

            // Save to localStorage
            const bookings = JSON.parse(localStorage.getItem('mirichi_bookings') || '[]');
            bookings.push(currentBooking);
            localStorage.setItem('mirichi_bookings', JSON.stringify(bookings));

            document.getElementById('reservation-form').classList.add('hidden');
            document.getElementById('success-message').classList.remove('hidden');
        }

        // Download ticket
        function downloadTicket() {
            if (!currentBooking || !selectedEvent) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            const qrContainer = document.createElement('div');
            qrContainer.style.display = 'none';
            document.body.appendChild(qrContainer);
            
            new QRCode(qrContainer, {
                text: currentBooking.ticketCode,
                width: 128,
                height: 128
            });

            setTimeout(() => {
                const qrCanvas = qrContainer.querySelector('canvas');
                const qrDataUrl = qrCanvas.toDataURL('image/png');
                document.body.removeChild(qrContainer);

                doc.setFillColor(196, 146, 42);
                doc.rect(0, 0, 210, 40, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(24);
                doc.text('TICKET ÉVÉNEMENT', 105, 25, { align: 'center' });

                doc.setTextColor(0, 0, 0);
                doc.setFontSize(20);
                doc.text(selectedEvent.title, 105, 60, { align: 'center' });

                doc.setFontSize(12);
                doc.text(`Date: ${selectedEvent.date}`, 20, 80);
                doc.text(`Heure: ${selectedEvent.time}`, 20, 90);
                doc.text(`Lieu: ${selectedEvent.location}`, 20, 100);
                doc.text(`Nom: ${currentBooking.fullName}`, 20, 120);
                doc.text(`Email: ${currentBooking.email}`, 20, 130);
                doc.text(`Téléphone: ${currentBooking.phone}`, 20, 140);

                doc.addImage(qrDataUrl, 'PNG', 80, 160, 50, 50);

                doc.setFillColor(245, 240, 255);
                doc.rect(20, 220, 170, 30, 'F');
                doc.setDrawColor(196, 146, 42);
                doc.rect(20, 220, 170, 30, 'S');

                doc.setFontSize(14);
                doc.setTextColor(196, 146, 42);
                doc.text(currentBooking.ticketCode, 105, 240, { align: 'center' });

                doc.save(`ticket-${selectedEvent.title.replace(/\s+/g, '-')}.pdf`);
            }, 100);
        }

        // Initialize
        loadEvents();
    </script>
</body>
</html>
