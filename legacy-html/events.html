<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="index, follow">
  <title>Événements Mirichi — Réservations & Billetterie</title>
  <meta name="description"
    content="Découvrez et réservez vos places pour les événements organisés par Mirichi Mbumba. Conférences, workshops, coaching et networking.">
  <meta property="og:title" content="Événements — Mirichi Mbumba">
  <meta property="og:description"
    content="Participez aux événements de Mirichi Mbumba : conférences, workshops, coaching et networking.">
  <meta property="og:image" content="/images/photo4.jpeg">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://mirichimbumba.com/events.html">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garant:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=stylesheet"
    rel="stylesheet">
  <link rel="stylesheet" href="_shared.css">
  <style>
    .event-card {
      transition: all 0.3s ease;
    }
    .event-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(196, 146, 42, 0.3);
    }
    .reservation-form {
      display: none;
    }
    .reservation-form.active {
      display: block;
    }
    .success-message {
      display: none;
    }
    .success-message.active {
      display: block;
    }
  </style>
</head>

<body>

  <div id="mm-nav-root"></div>

  <main class="page-shell">
    <section class="section-alt py-16 px-6 lg:px-12">
      <div class="max-w-7xl mx-auto">
        <p class="breadcrumb mb-6"><a href="index.html">Accueil</a> · Événements</p>
        <div class="section-label flex items-center gap-3 mb-4 reveal">
          <div class="gold-line"></div>Événements
        </div>
        <h1 class="reveal reveal-delay-1" style="font-size:clamp(2.25rem,4vw,3.25rem);font-weight:300;line-height:1.15">
          Réservez votre <span style="color:var(--gold-light);font-style:italic">place</span>
        </h1>
        <p class="reveal reveal-delay-2" style="color:var(--muted);max-width:640px;margin-top:1rem;line-height:1.8">
          Découvrez et participez aux événements organisés par Mirichi Mbumba : conférences, workshops, coaching et networking.
        </p>
      </div>
    </section>

    <section class="section-main py-20 px-6 lg:px-12">
      <div class="max-w-7xl mx-auto">
        
        <!-- Events List -->
        <div id="events-section">
          <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="events-grid">
            <!-- Events will be loaded dynamically -->
          </div>
        </div>

        <!-- Reservation Form -->
        <div id="reservation-form" class="reservation-form max-w-2xl mx-auto mt-12 p-8" style="background:var(--dark-2);border:1px solid var(--gold-pale);border-radius:8px;">
          <button onclick="showEvents()" class="mb-6 text-sm" style="color:var(--muted);background:none;border:none;cursor:pointer;">
            ← Retour aux événements
          </button>
          <h2 class="mm-h2 mb-6" style="font-size:clamp(1.6rem,2.6vw,2.3rem);font-weight:300;">Réserver votre place</h2>
          <div id="selected-event-info" class="mb-6 p-4" style="background:var(--dark-3);border-radius:4px;"></div>
          
          <form id="booking-form" onsubmit="handleBooking(event)">
            <div class="mb-4">
              <label class="block mb-2 text-sm" style="color:var(--muted);">Nom complet *</label>
              <input type="text" id="fullName" required class="w-full p-3" style="background:var(--dark-3);border:1px solid var(--gold-pale);color:var(--white);border-radius:4px;">
            </div>
            <div class="mb-4">
              <label class="block mb-2 text-sm" style="color:var(--muted);">Email *</label>
              <input type="email" id="email" required class="w-full p-3" style="background:var(--dark-3);border:1px solid var(--gold-pale);color:var(--white);border-radius:4px;">
            </div>
            <div class="mb-4">
              <label class="block mb-2 text-sm" style="color:var(--muted);">Téléphone *</label>
              <input type="tel" id="phone" required class="w-full p-3" style="background:var(--dark-3);border:1px solid var(--gold-pale);color:var(--white);border-radius:4px;">
            </div>
            <div class="mb-6">
              <label class="block mb-2 text-sm" style="color:var(--muted);">Message (optionnel)</label>
              <textarea id="message" rows="4" class="w-full p-3" style="background:var(--dark-3);border:1px solid var(--gold-pale);color:var(--white);border-radius:4px;"></textarea>
            </div>
            <button type="submit" class="w-full py-4" style="background:var(--gold);color:var(--dark);border:none;border-radius:4px;font-weight:600;cursor:pointer;">
              Réserver ma place
            </button>
          </form>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="success-message max-w-2xl mx-auto mt-12 p-8 text-center" style="background:var(--dark-2);border:1px solid var(--gold-pale);border-radius:8px;">
          <div class="text-6xl mb-6" style="color:#10b981;">✓</div>
          <h2 class="mm-h2 mb-4" style="font-size:clamp(1.6rem,2.6vw,2.3rem);font-weight:300;">Réservation confirmée!</h2>
          <p style="color:var(--muted);margin-bottom:24px;">Votre place a été réservée avec succès. Votre ticket est prêt.</p>
          <button onclick="downloadTicket()" class="px-8 py-4 mr-4" style="background:var(--gold);color:var(--dark);border:none;border-radius:4px;font-weight:600;cursor:pointer;">
            Télécharger mon ticket
          </button>
          <button onclick="showEvents()" class="px-8 py-4" style="background:var(--dark-3);color:var(--white);border:1px solid var(--gold-pale);border-radius:4px;cursor:pointer;">
            Retour aux événements
          </button>
        </div>

      </div>
    </section>
  </main>

  <script src="_shared.js"></script>
  <script>
    // Sample events data
    const events = [
      {
        id: 1,
        title: 'Conférence Leadership',
        date: 'Samedi 15 novembre 2026',
        time: 'À partir de 09h00',
        location: 'Grand Hôtel, Kinshasa',
        description: 'Une conférence sur le leadership moderne et les compétences essentielles pour réussir dans le monde professionnel.',
        category: 'Leadership'
      },
      {
        id: 2,
        title: 'Workshop Innovation',
        date: 'Samedi 20 décembre 2026',
        time: 'À partir de 10h00',
        location: 'Digital Hub, Kinshasa',
        description: 'Atelier pratique sur l\'innovation technologique et les opportunités digitales.',
        category: 'Technologie'
      },
      {
        id: 3,
        title: 'Networking Business',
        date: 'Samedi 10 janvier 2027',
        time: 'À partir de 18h00',
        location: 'Business Center, Kinshasa',
        description: 'Soirée de networking pour entrepreneurs et professionnels.',
        category: 'Business'
      }
    ];

    let selectedEvent = null;
    let currentBooking = null;

    // Load events on page load
    function loadEvents() {
      const eventsGrid = document.getElementById('events-grid');
      
      if (events.length > 0) {
        eventsGrid.innerHTML = events.map(event => `
          <div class="event-card p-6" style="background:var(--dark-2);border:1px solid var(--gold-pale);border-radius:8px;cursor:pointer;" onclick="selectEvent(${event.id})">
            <div class="mb-4">
              <span class="text-xs px-3 py-1" style="background:var(--gold-pale);color:var(--gold-light);border-radius:20px;">${event.category}</span>
            </div>
            <h3 class="mb-3" style="font-family:'Cormorant Garant',serif;font-size:1.5rem;font-weight:300;color:var(--white);">${event.title}</h3>
            <div class="space-y-2 mb-4">
              <div class="flex items-center gap-2 text-sm" style="color:var(--muted);">
                <span>📅</span>
                <span>${event.date}</span>
              </div>
              <div class="flex items-center gap-2 text-sm" style="color:var(--muted);">
                <span>🕐</span>
                <span>${event.time}</span>
              </div>
              <div class="flex items-center gap-2 text-sm" style="color:var(--muted);">
                <span>📍</span>
                <span>${event.location}</span>
              </div>
            </div>
            <p class="text-sm mb-4" style="color:var(--muted);line-height:1.6;">${event.description?.substring(0, 120) || ''}${event.description?.length > 120 ? '...' : ''}</p>
            <button class="px-6 py-3 text-sm" style="background:var(--gold);color:var(--dark);border:none;border-radius:4px;font-weight:600;cursor:pointer;">
              Réserver ma place
            </button>
          </div>
        `).join('');
      } else {
        eventsGrid.innerHTML = `
          <div class="text-center py-12 col-span-full">
            <p style="color:var(--muted);">Aucun événement programmé pour le moment.</p>
            <p style="color:var(--muted);">Revenez bientôt pour découvrir nos nouvelles activités!</p>
          </div>
        `;
      }
    }

    // Select event and show reservation form
    function selectEvent(eventId) {
      selectedEvent = events.find(e => e.id === eventId);
      if (!selectedEvent) return;

      document.getElementById('events-section').style.display = 'none';
      document.getElementById('reservation-form').classList.add('active');
      document.getElementById('success-message').classList.remove('active');

      document.getElementById('selected-event-info').innerHTML = `
        <strong style="color:var(--white);">${selectedEvent.title}</strong><br>
        <span style="color:var(--muted);">${selectedEvent.date}</span><br>
        <span style="color:var(--muted);">${selectedEvent.location}</span>
      `;
    }

    // Show events list
    function showEvents() {
      document.getElementById('events-section').style.display = 'block';
      document.getElementById('reservation-form').classList.remove('active');
      document.getElementById('success-message').classList.remove('active');
      document.getElementById('booking-form').reset();
      selectedEvent = null;
      currentBooking = null;
    }

    // Handle booking submission
    function handleBooking(event) {
      event.preventDefault();

      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const message = document.getElementById('message').value;

      // Generate unique ticket code
      const ticketCode = 'MIR-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();

      currentBooking = {
        event: selectedEvent,
        fullName,
        email,
        phone,
        message,
        ticketCode,
        bookingDate: new Date().toISOString()
      };

      // Save to localStorage
      const bookings = JSON.parse(localStorage.getItem('mirichi_bookings') || '[]');
      bookings.push(currentBooking);
      localStorage.setItem('mirichi_bookings', JSON.stringify(bookings));

      // Show success message
      document.getElementById('reservation-form').classList.remove('active');
      document.getElementById('success-message').classList.add('active');
    }

    // Generate and download ticket PDF
    function downloadTicket() {
      if (!currentBooking || !selectedEvent) return;

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Generate QR Code
      const qrContainer = document.createElement('div');
      qrContainer.style.display = 'none';
      document.body.appendChild(qrContainer);
      
      new QRCode(qrContainer, {
        text: currentBooking.ticketCode,
        width: 128,
        height: 128
      });

      setTimeout(() => {
        const qrCanvas = qrContainer.querySelector('canvas');
        const qrDataUrl = qrCanvas.toDataURL('image/png');
        document.body.removeChild(qrContainer);

        // Header
        doc.setFillColor(196, 146, 42);
        doc.rect(0, 0, 210, 40, 'F');
        doc.setTextColor(9, 9, 15);
        doc.setFontSize(24);
        doc.text('TICKET ÉVÉNEMENT', 105, 25, { align: 'center' });

        // Event Title
        doc.setTextColor(245, 240, 232);
        doc.setFontSize(20);
        doc.text(selectedEvent.title, 105, 60, { align: 'center' });

        // Event Details
        doc.setFontSize(12);
        let yPos = 80;

        doc.setFontSize(14);
        doc.setTextColor(196, 146, 42);
        doc.text('Détails de l\'événement', 20, yPos);
        yPos += 10;

        doc.setTextColor(245, 240, 232);
        doc.setFontSize(11);
        doc.text(`Date: ${selectedEvent.date}`, 20, yPos);
        yPos += 8;
        doc.text(`Heure: ${selectedEvent.time}`, 20, yPos);
        yPos += 8;
        doc.text(`Lieu: ${selectedEvent.location}`, 20, yPos);
        yPos += 15;

        // Participant Info
        doc.setFontSize(14);
        doc.setTextColor(196, 146, 42);
        doc.text('Informations du participant', 20, yPos);
        yPos += 10;

        doc.setTextColor(245, 240, 232);
        doc.setFontSize(11);
        doc.text(`Nom: ${currentBooking.fullName}`, 20, yPos);
        yPos += 8;
        doc.text(`Email: ${currentBooking.email}`, 20, yPos);
        yPos += 8;
        doc.text(`Téléphone: ${currentBooking.phone}`, 20, yPos);
        yPos += 20;

        // QR Code
        doc.setFontSize(14);
        doc.setTextColor(196, 146, 42);
        doc.text('Code QR - Scannez à l\'entrée', 105, yPos, { align: 'center' });
        yPos += 10;

        doc.addImage(qrDataUrl, 'PNG', 80, yPos, 50, 50);
        yPos += 60;

        // Ticket Code
        doc.setFillColor(22, 22, 26);
        doc.rect(20, yPos, 170, 30, 'F');
        doc.setDrawColor(196, 146, 42);
        doc.rect(20, yPos, 170, 30, 'S');

        doc.setFontSize(10);
        doc.setTextColor(196, 146, 42);
        doc.text('Code Ticket Unique', 105, yPos + 12, { align: 'center' });

        doc.setFontSize(14);
        doc.setTextColor(245, 240, 232);
        doc.setFont(undefined, 'bold');
        doc.text(currentBooking.ticketCode, 105, yPos + 24, { align: 'center' });
        doc.setFont(undefined, 'normal');

        // Footer
        doc.setFontSize(10);
        doc.setTextColor(196, 146, 42);
        doc.text('Présentez ce code ou le QR code à l\'entrée de l\'événement', 105, 280, { align: 'center' });

        // Save PDF
        doc.save(`ticket-${selectedEvent.title.replace(/\s+/g, '-')}-${currentBooking.fullName.replace(/\s+/g, '-')}.pdf`);
      }, 100);
    }

    // Initialize
    loadEvents();
  </script>
</body>
</html>
