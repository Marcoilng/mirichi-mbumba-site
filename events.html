<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Événements Mirichi</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --text: #6b6375;
            --text-h: #08060d;
            --bg: #fff;
            --border: #e5e4e7;
            --code-bg: #f4f3ec;
            --accent: #aa3bff;
            --accent-bg: rgba(170, 59, 255, 0.1);
            --accent-border: rgba(170, 59, 255, 0.5);
            --shadow: rgba(0, 0, 0, 0.1) 0 10px 15px -3px, rgba(0, 0, 0, 0.05) 0 4px 6px -2px;
            --sans: system-ui, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            font-family: var(--sans);
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .header-icon {
            color: var(--accent);
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 56px;
            color: var(--accent);
            margin: 0 0 16px;
            letter-spacing: -1px;
        }

        .header p {
            font-size: 20px;
            color: var(--text);
        }

        .section-title {
            font-size: 32px;
            color: var(--text-h);
            margin-bottom: 30px;
            padding-left: 20px;
            border-left: 4px solid var(--accent);
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
        }

        .event-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            box-shadow: var(--shadow);

            &:hover {
                transform: translateY(-8px);
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
                border-color: var(--accent);
            }
        }

        .card-image {
            background: linear-gradient(135deg, var(--accent-bg) 0%, var(--code-bg) 100%);
            padding: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 150px;
        }

        .card-icon {
            color: var(--accent);
        }

        .card-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 24px;
            color: var(--text-h);
            margin: 0 0 8px;
            font-weight: 700;
        }

        .card-details {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-bottom: 16px;
        }

        .event-detail {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            color: var(--text);
        }

        .detail-icon {
            color: var(--accent);
            width: 20px;
            height: 20px;
        }

        .card-description {
            font-size: 14px;
            color: var(--text);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .card-button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow);
            align-self: flex-start;
            text-decoration: none;
            display: inline-block;

            &:hover {
                background: var(--accent-border);
                transform: translateY(-2px);
            }
        }

        .no-events {
            text-align: center;
            padding: 60px 20px;
            background: var(--code-bg);
            border-radius: 12px;
        }

        .no-events p {
            font-size: 18px;
            color: var(--text);
            margin: 10px 0;
        }

        /* Reservation Form Styles */
        .reservation-form {
            display: none;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow);
            max-width: 600px;
            margin: 0 auto;
        }

        .reservation-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-h);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            font-family: var(--sans);
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .submit-button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow);
            width: 100%;

            &:hover {
                background: var(--accent-border);
                transform: translateY(-2px);
            }
        }

        .back-button {
            background: var(--code-bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;

            &:hover {
                background: var(--border);
            }
        }

        .success-message {
            display: none;
            text-align: center;
            padding: 40px;
            background: var(--code-bg);
            border-radius: 12px;
        }

        .success-message.active {
            display: block;
        }

        .success-icon {
            color: #10b981;
            font-size: 64px;
            margin-bottom: 20px;
        }

        .success-message h2 {
            color: var(--text-h);
            margin-bottom: 16px;
        }

        .success-message p {
            color: var(--text);
            margin-bottom: 24px;
        }

        .download-button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: var(--shadow);

            &:hover {
                background: var(--accent-border);
                transform: translateY(-2px);
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 36px;
            }

            .header p {
                font-size: 16px;
            }

            .section-title {
                font-size: 24px;
            }

            .events-grid {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 20px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <svg class="header-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <h1>Événements Mirichi</h1>
            <p>Découvrez et réservez vos places pour nos événements</p>
        </header>

        <section id="events-section">
            <h2 class="section-title">Événements à venir</h2>
            <div class="events-grid" id="events-grid">
                <!-- Events will be loaded dynamically -->
            </div>
        </section>

        <!-- Reservation Form -->
        <div id="reservation-form" class="reservation-form">
            <button class="back-button" onclick="showEvents()">← Retour aux événements</button>
            <h2 style="margin-bottom: 20px; color: var(--text-h);">Réserver votre place</h2>
            <div id="selected-event-info" style="margin-bottom: 20px; padding: 15px; background: var(--code-bg); border-radius: 8px;"></div>
            
            <form id="booking-form" onsubmit="handleBooking(event)">
                <div class="form-group">
                    <label for="fullName">Nom complet *</label>
                    <input type="text" id="fullName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Téléphone *</label>
                    <input type="tel" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="message">Message (optionnel)</label>
                    <textarea id="message"></textarea>
                </div>
                <button type="submit" class="submit-button">Réserver ma place</button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="success-message">
            <svg class="success-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <h2>Réservation confirmée!</h2>
            <p>Votre place a été réservée avec succès. Votre ticket est prêt.</p>
            <button class="download-button" onclick="downloadTicket()">Télécharger mon ticket</button>
            <button class="back-button" style="margin-top: 20px;" onclick="showEvents()">Retour aux événements</button>
        </div>
    </div>

    <script>
        // Sample events data
        const events = [
            {
                id: 1,
                title: 'Conférence Leadership',
                date: 'Samedi 15 novembre 2026',
                time: 'À partir de 09h00',
                location: 'Grand Hôtel, Kinshasa',
                description: 'Une conférence sur le leadership moderne et les compétences essentielles pour réussir dans le monde professionnel.',
                category: 'Leadership'
            },
            {
                id: 2,
                title: 'Workshop Innovation',
                date: 'Samedi 20 décembre 2026',
                time: 'À partir de 10h00',
                location: 'Digital Hub, Kinshasa',
                description: 'Atelier pratique sur l\'innovation technologique et les opportunités digitales.',
                category: 'Technologie'
            },
            {
                id: 3,
                title: 'Networking Business',
                date: 'Samedi 10 janvier 2027',
                time: 'À partir de 18h00',
                location: 'Business Center, Kinshasa',
                description: 'Soirée de networking pour entrepreneurs et professionnels.',
                category: 'Business'
            }
        ];

        let selectedEvent = null;
        let currentBooking = null;

        // Load events on page load
        function loadEvents() {
            const eventsGrid = document.getElementById('events-grid');
            
            if (events.length > 0) {
                eventsGrid.innerHTML = events.map(event => `
                    <div class="event-card" onclick="selectEvent(${event.id})">
                        <div class="card-image">
                            <svg class="card-icon" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                <line x1="16" y1="2" x2="16" y2="6"></line>
                                <line x1="8" y1="2" x2="8" y2="6"></line>
                                <line x1="3" y1="10" x2="21" y2="10"></line>
                            </svg>
                        </div>
                        <div class="card-content">
                            <h3 class="card-title">${event.title}</h3>
                            <div class="card-details">
                                <div class="event-detail">
                                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                                        <line x1="16" y1="2" x2="16" y2="6"></line>
                                        <line x1="8" y1="2" x2="8" y2="6"></line>
                                        <line x1="3" y1="10" x2="21" y2="10"></line>
                                    </svg>
                                    <span>${event.date}</span>
                                </div>
                                <div class="event-detail">
                                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                    <span>${event.time}</span>
                                </div>
                                <div class="event-detail">
                                    <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                                        <circle cx="12" cy="10" r="3"></circle>
                                    </svg>
                                    <span>${event.location}</span>
                                </div>
                            </div>
                            <p class="card-description">${event.description?.substring(0, 150) || ''}${event.description?.length > 150 ? '...' : ''}</p>
                            <button class="card-button">Réserver ma place</button>
                        </div>
                    </div>
                `).join('');
            } else {
                eventsGrid.innerHTML = `
                    <div class="no-events">
                        <p>Aucun événement programmé pour le moment.</p>
                        <p>Revenez bientôt pour découvrir nos nouvelles activités!</p>
                    </div>
                `;
            }
        }

        // Select event and show reservation form
        function selectEvent(eventId) {
            selectedEvent = events.find(e => e.id === eventId);
            if (!selectedEvent) return;

            document.getElementById('events-section').style.display = 'none';
            document.getElementById('reservation-form').classList.add('active');
            document.getElementById('success-message').classList.remove('active');

            document.getElementById('selected-event-info').innerHTML = `
                <strong>${selectedEvent.title}</strong><br>
                ${selectedEvent.date}<br>
                ${selectedEvent.location}
            `;
        }

        // Show events list
        function showEvents() {
            document.getElementById('events-section').style.display = 'block';
            document.getElementById('reservation-form').classList.remove('active');
            document.getElementById('success-message').classList.remove('active');
            document.getElementById('booking-form').reset();
            selectedEvent = null;
            currentBooking = null;
        }

        // Handle booking submission
        function handleBooking(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;

            // Generate unique ticket code
            const ticketCode = 'MIR-' + Date.now().toString(36).toUpperCase() + '-' + Math.random().toString(36).substring(2, 8).toUpperCase();

            currentBooking = {
                event: selectedEvent,
                fullName,
                email,
                phone,
                message,
                ticketCode,
                bookingDate: new Date().toISOString()
            };

            // Save to localStorage
            const bookings = JSON.parse(localStorage.getItem('mirichi_bookings') || '[]');
            bookings.push(currentBooking);
            localStorage.setItem('mirichi_bookings', JSON.stringify(bookings));

            // Show success message
            document.getElementById('reservation-form').classList.remove('active');
            document.getElementById('success-message').classList.add('active');
        }

        // Generate and download ticket PDF
        function downloadTicket() {
            if (!currentBooking || !selectedEvent) return;

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Generate QR Code
            const qrContainer = document.createElement('div');
            qrContainer.style.display = 'none';
            document.body.appendChild(qrContainer);
            
            new QRCode(qrContainer, {
                text: currentBooking.ticketCode,
                width: 128,
                height: 128
            });

            setTimeout(() => {
                const qrCanvas = qrContainer.querySelector('canvas');
                const qrDataUrl = qrCanvas.toDataURL('image/png');
                document.body.removeChild(qrContainer);

                // Header
                doc.setFillColor(170, 59, 255);
                doc.rect(0, 0, 210, 40, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(24);
                doc.text('TICKET ÉVÉNEMENT', 105, 25, { align: 'center' });

                // Event Title
                doc.setTextColor(0, 0, 0);
                doc.setFontSize(20);
                doc.text(selectedEvent.title, 105, 60, { align: 'center' });

                // Event Details
                doc.setFontSize(12);
                let yPos = 80;

                doc.setFontSize(14);
                doc.setTextColor(170, 59, 255);
                doc.text('Détails de l\'événement', 20, yPos);
                yPos += 10;

                doc.setTextColor(0, 0, 0);
                doc.setFontSize(11);
                doc.text(`Date: ${selectedEvent.date}`, 20, yPos);
                yPos += 8;
                doc.text(`Heure: ${selectedEvent.time}`, 20, yPos);
                yPos += 8;
                doc.text(`Lieu: ${selectedEvent.location}`, 20, yPos);
                yPos += 15;

                // Participant Info
                doc.setFontSize(14);
                doc.setTextColor(170, 59, 255);
                doc.text('Informations du participant', 20, yPos);
                yPos += 10;

                doc.setTextColor(0, 0, 0);
                doc.setFontSize(11);
                doc.text(`Nom: ${currentBooking.fullName}`, 20, yPos);
                yPos += 8;
                doc.text(`Email: ${currentBooking.email}`, 20, yPos);
                yPos += 8;
                doc.text(`Téléphone: ${currentBooking.phone}`, 20, yPos);
                yPos += 20;

                // QR Code
                doc.setFontSize(14);
                doc.setTextColor(170, 59, 255);
                doc.text('Code QR - Scannez à l\'entrée', 105, yPos, { align: 'center' });
                yPos += 10;

                doc.addImage(qrDataUrl, 'PNG', 80, yPos, 50, 50);
                yPos += 60;

                // Ticket Code
                doc.setFillColor(245, 240, 255);
                doc.rect(20, yPos, 170, 30, 'F');
                doc.setDrawColor(170, 59, 255);
                doc.rect(20, yPos, 170, 30, 'S');

                doc.setFontSize(10);
                doc.setTextColor(100, 100, 100);
                doc.text('Code Ticket Unique', 105, yPos + 12, { align: 'center' });

                doc.setFontSize(14);
                doc.setTextColor(170, 59, 255);
                doc.setFont(undefined, 'bold');
                doc.text(currentBooking.ticketCode, 105, yPos + 24, { align: 'center' });
                doc.setFont(undefined, 'normal');

                // Footer
                doc.setFontSize(10);
                doc.setTextColor(150, 150, 150);
                doc.text('Présentez ce code ou le QR code à l\'entrée de l\'événement', 105, 280, { align: 'center' });

                // Save PDF
                doc.save(`ticket-${selectedEvent.title.replace(/\s+/g, '-')}-${currentBooking.fullName.replace(/\s+/g, '-')}.pdf`);
            }, 100);
        }

        // Initialize
        loadEvents();
    </script>
</body>
</html>
